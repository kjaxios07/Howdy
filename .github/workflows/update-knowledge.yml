name: Daily Knowledge Base Refresh

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC daily (12 PM AEST)
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write           # to commit updated knowledge/base.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh knowledge base
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-knowledge.js

      - name: Commit if changed
        run: |
          git config user.name  "howdy-kip-bot"
          git config user.email "bot@howdy.com.au"
          git diff --quiet knowledge/base.json || (
            git add knowledge/base.json &&
            git commit -m "chore: refresh knowledge base $(date +%Y-%m-%d)" &&
            git push
          )
