<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kip — Your Australian Life Copilot | Howdy</title>
<meta name="description" content="Ask Kip anything about life in Australia — visas, work rights, housing, tax, healthcare and more. Free. Instant. Verified.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#07040F;--clay-base:#100C28;--clay-mid:#181038;
  --accent:#A78BFA;--accent-d:#7C3AED;--accent-xd:#4C1D95;
  --kip:#67E8F9;--pink:#F9A8D4;--green:#6EE7B7;
  --t1:rgba(255,255,255,.93);--t2:rgba(255,255,255,.60);--t3:rgba(255,255,255,.34);
  --gl:rgba(255,255,255,.055);--gl-md:rgba(255,255,255,.08);
  --gl-b:rgba(255,255,255,.09);--gl-t:rgba(255,255,255,.17);
  --neu-i:inset 4px 4px 10px rgba(0,0,0,.6),inset -2px -2px 6px rgba(255,255,255,.03);
  --r-neu:14px;--fd:'Fraunces',Georgia,serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="light"]{
  --ground:#EBE4FF;--clay-base:#DDD5F8;--clay-mid:#D4CBF2;
  --t1:#1E1B4B;--t2:rgba(30,27,75,.63);--t3:rgba(30,27,75,.36);
  --gl:rgba(255,255,255,.55);--gl-md:rgba(255,255,255,.72);
  --gl-b:rgba(255,255,255,.75);--gl-t:rgba(255,255,255,.95);
  --neu-i:inset 4px 4px 10px rgba(130,90,210,.18),inset -3px -3px 8px rgba(255,255,255,.8);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;height:100%}
body{
  font-family:var(--fb);color:var(--t1);
  background:radial-gradient(ellipse 80% 60% at 15% 10%,rgba(124,58,237,.14) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 90%,rgba(56,189,248,.09) 0%,transparent 60%),
    var(--ground);
  display:flex;flex-direction:column;height:100%;overflow:hidden;
}
[data-theme="light"] body{
  background:radial-gradient(ellipse 80% 60% at 15% 10%,rgba(167,139,250,.2) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 90%,rgba(103,232,249,.14) 0%,transparent 60%),var(--ground);
}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:var(--fb);border:none;background:none}
:focus-visible{outline:2px solid var(--kip);outline-offset:3px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* KIP ANIMATIONS */
.kip-eye-l,.kip-eye-r{transform-box:fill-box;transform-origin:center}
@keyframes kipBlink{0%,76%,82%,100%{transform:scaleY(1)}79%{transform:scaleY(.05)}}
.kip-eye-l{animation:kipBlink 4.8s ease-in-out infinite}
.kip-eye-r{animation:kipBlink 4.8s ease-in-out infinite;animation-delay:.11s}
@keyframes headBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}

/* HEADER — Glassmorphism */
.chat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:62px;flex-shrink:0;
  background:rgba(7,4,15,.7);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--gl-b);
  position:relative;z-index:10;
}
[data-theme="light"] .chat-header{background:rgba(235,228,255,.82)}
.chat-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.5),rgba(103,232,249,.35),transparent);
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;color:var(--t3);
  padding:8px 12px;border-radius:9px;font-family:var(--fb);
  transition:color .15s,background .15s;min-height:40px;
}
.back-btn:hover{color:var(--t1);background:rgba(167,139,250,.1)}
.back-btn svg{opacity:.6}
.header-identity{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.header-kip-svg{animation:headBob 3.2s ease-in-out infinite}
.header-kip-name{
  font-family:var(--fd);font-size:15px;font-weight:400;letter-spacing:-.01em;
  background:linear-gradient(135deg,#fff 0%,#C4B5FD 55%,#67E8F9 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
[data-theme="light"] .header-kip-name{
  background:linear-gradient(135deg,#4C1D95 0%,#7C3AED 55%,#0891B2 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.header-status{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--t3)}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6);animation:statusPulse 2s ease-in-out infinite}
@keyframes statusPulse{0%,100%{box-shadow:0 0 6px rgba(34,197,94,.5)}50%{box-shadow:0 0 12px rgba(34,197,94,.9)}}
.session-badge{
  font-size:10px;color:var(--t3);
  background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.16);
  border-radius:99px;padding:4px 11px;letter-spacing:.02em;white-space:nowrap;
}
.theme-btn{
  width:34px;height:34px;border-radius:9px;
  background:var(--gl);border:1px solid var(--gl-b);
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);transition:background .2s,color .15s;cursor:pointer;
}
.theme-btn:hover{color:var(--t1);background:var(--gl-md)}

/* CHAT AREA */
.chat-area{
  flex:1;overflow-y:auto;padding:24px 0 16px;
  display:flex;flex-direction:column;gap:0;
  scrollbar-width:thin;scrollbar-color:rgba(124,58,237,.2) transparent;
}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:rgba(124,58,237,.2);border-radius:2px}

/* MESSAGES */
.msg-row{display:flex;align-items:flex-end;gap:10px;padding:5px 20px;max-width:100%;animation:msgIn .35s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:rgba(103,232,249,.08);border:1px solid rgba(103,232,249,.18);
  align-self:flex-end;margin-bottom:20px;
}
.msg-avatar.user-av{
  background:rgba(124,58,237,.14);border-color:rgba(124,58,237,.28);
  font-size:11px;font-weight:700;color:var(--accent);font-family:var(--fb);
}
.msg-wrap{display:flex;flex-direction:column;gap:6px;max-width:min(680px,82%)}
.msg-row.user .msg-wrap{align-items:flex-end}
.msg-bubble{padding:13px 16px;border-radius:18px;font-size:13.5px;line-height:1.74}

/* Kip bubble — Glassmorphism */
.kip-bubble{
  background:var(--gl-md);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid var(--gl-b);border-top-color:var(--gl-t);
  color:var(--t1);border-radius:4px 18px 18px 18px;
  box-shadow:0 4px 24px rgba(0,0,0,.25);
}
.kip-bubble strong{color:#DDD6FE;font-weight:600}
[data-theme="light"] .kip-bubble strong{color:var(--accent-d)}
.kip-bubble ul{padding-left:18px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.kip-bubble li{font-size:13.5px;color:var(--t2)}
.kip-bubble p{margin:6px 0}.kip-bubble p:first-child{margin-top:0}.kip-bubble p:last-child{margin-bottom:0}

/* User bubble — Claymorphism */
.user-bubble{
  background:linear-gradient(145deg,rgba(167,139,250,.25),rgba(109,40,217,.18));
  border:1px solid rgba(167,139,250,.28);
  color:var(--t1);border-radius:18px 18px 4px 18px;
  box-shadow:0 5px 0 rgba(76,29,149,.3),0 8px 24px rgba(124,58,237,.18),inset 0 1px 0 rgba(255,255,255,.1);
}

/* Source chips */
.msg-sources{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px}
.source-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(103,232,249,.06);border:1px solid rgba(103,232,249,.16);
  border-radius:99px;padding:3px 10px;font-size:10.5px;color:rgba(103,232,249,.75);letter-spacing:.02em;cursor:default;
}
.source-chip svg{opacity:.6;flex-shrink:0}

/* Typing — Glass */
.typing-row{padding:8px 20px;display:flex;align-items:center;gap:10px}
.typing-row .msg-avatar{margin-bottom:0}
.typing-dots{
  display:flex;align-items:center;gap:5px;padding:13px 16px;
  background:var(--gl-md);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--gl-b);border-top-color:var(--gl-t);
  border-radius:4px 18px 18px 18px;
}
.typing-dot{width:7px;height:7px;border-radius:50%;background:rgba(167,139,250,.5);animation:typeDot 1.4s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.18s}.typing-dot:nth-child(3){animation-delay:.36s}
@keyframes typeDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}

/* INPUT AREA — Neumorphism base with Clay send button */
.chat-input-area{
  flex-shrink:0;padding:12px 16px 16px;
  background:var(--clay-mid);
  border-top:1px solid rgba(124,58,237,.15);
  position:relative;
}
.chat-input-area::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.4),rgba(103,232,249,.3),transparent);
}
.input-row{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--clay-mid);border-radius:18px;padding:10px 10px 10px 16px;
  box-shadow:var(--neu-i);transition:box-shadow .2s;
}
.input-row:focus-within{box-shadow:var(--neu-i),0 0 0 2.5px rgba(167,139,250,.38)}
.chat-textarea{
  flex:1;background:none;border:none;outline:none;
  color:var(--t1);font-family:var(--fb);font-size:14px;line-height:1.5;
  resize:none;max-height:120px;min-height:22px;padding:0;
}
.chat-textarea::placeholder{color:var(--t3)}

/* Send button — Claymorphism */
.send-btn{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(155deg,#B794F4 0%,#8B5CF6 45%,#6D28D9 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 5px 0 #3B0764,0 10px 22px rgba(109,40,217,.45),inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(0);transition:opacity .15s,transform .12s var(--spring),box-shadow .12s;
}
.send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 #3B0764,0 14px 28px rgba(109,40,217,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.send-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #3B0764,0 4px 12px rgba(109,40,217,.35)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.send-btn svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5}
.input-footer{display:flex;justify-content:center;margin-top:9px}
.input-footer p{font-size:10px;color:var(--t3);text-align:center;letter-spacing:.02em;line-height:1.6}
.input-footer a{color:rgba(167,139,250,.6);text-decoration:underline;transition:color .15s}
.input-footer a:hover{color:rgba(196,181,253,.8)}

/* STARTERS — Glass pills */
.starters{padding:16px 20px 8px;display:flex;flex-wrap:wrap;gap:8px}
.starter-btn{
  font-family:var(--fb);font-size:12px;font-weight:500;color:var(--t2);
  background:var(--gl);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--gl-b);border-top-color:var(--gl-t);
  border-radius:99px;padding:8px 15px;min-height:34px;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.starter-btn:hover{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.3);color:var(--t1);box-shadow:0 2px 12px rgba(124,58,237,.18)}

@media(max-width:600px){
  .session-badge{display:none}
  .msg-row{padding:4px 12px}
  .starters{padding:12px 12px 4px}
  .chat-input-area{padding:10px 12px 12px}
  .msg-wrap{max-width:88%}
}
</style>
</head>
<body>

<header class="chat-header">
  <a href="/" class="back-btn" aria-label="Back to Howdy">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Howdy
  </a>
  <div class="header-identity">
    <!-- Kip face — claymorphic purple, glass-accented -->
    <svg class="header-kip-svg" width="32" height="32" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <defs>
        <radialGradient id="H-body" cx="38%" cy="28%" r="64%"><stop offset="0%" stop-color="#C4B5FD"/><stop offset="40%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#3B0764"/></radialGradient>
        <radialGradient id="H-iris" cx="28%" cy="22%" r="72%"><stop offset="0%" stop-color="#67E8F9"/><stop offset="55%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0369A1"/></radialGradient>
        <filter id="H-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="H-shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3B0764" flood-opacity=".55"/></filter>
      </defs>
      <!-- Body -->
      <circle cx="60" cy="60" r="40" fill="url(#H-body)" filter="url(#H-shadow)"/>
      <!-- Clay shine -->
      <ellipse cx="44" cy="38" rx="14" ry="8" fill="rgba(255,255,255,.26)" transform="rotate(-30 44 38)"/>
      <!-- Eyes -->
      <g class="kip-eye-l">
        <circle cx="44" cy="60" r="9" fill="#1E1B4B"/>
        <circle cx="44" cy="60" r="6" fill="url(#H-iris)" filter="url(#H-glow)"/>
        <circle cx="41" cy="57" r="2.4" fill="#fff" opacity=".95"/>
      </g>
      <g class="kip-eye-r">
        <circle cx="76" cy="60" r="9" fill="#1E1B4B"/>
        <circle cx="76" cy="60" r="6" fill="url(#H-iris)" filter="url(#H-glow)"/>
        <circle cx="73" cy="57" r="2.4" fill="#fff" opacity=".95"/>
      </g>
      <!-- Blush -->
      <ellipse cx="33" cy="72" rx="8" ry="5" fill="rgba(249,168,212,.4)"/>
      <ellipse cx="87" cy="72" rx="8" ry="5" fill="rgba(249,168,212,.4)"/>
      <!-- Smile -->
      <path d="M44 78 Q60 94 76 78" fill="none" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" filter="url(#H-glow)"/>
    </svg>
    <div>
      <div class="header-kip-name">Kip</div>
      <div class="header-status"><span class="status-dot"></span>Online · Verified sources</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="session-badge">Session only · Nothing stored</span>
    <button id="themeToggle" class="theme-btn" aria-label="Toggle light/dark mode">
      <svg id="iconMoon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</header>

<div class="chat-area" id="chatArea" role="log" aria-live="polite" aria-label="Chat with Kip">
  <div class="starters" id="starters" aria-label="Suggested questions">
    <button class="starter-btn" onclick="sendStarter(this)">Can I work on a student visa?</button>
    <button class="starter-btn" onclick="sendStarter(this)">How do I get a Tax File Number?</button>
    <button class="starter-btn" onclick="sendStarter(this)">What's the minimum wage in Australia?</button>
    <button class="starter-btn" onclick="sendStarter(this)">How do I rent a place in Sydney?</button>
    <button class="starter-btn" onclick="sendStarter(this)">What is OSHC and do I need it?</button>
    <button class="starter-btn" onclick="sendStarter(this)">Tell me about the 485 Graduate Visa</button>
  </div>
</div>

<div class="chat-input-area">
  <form id="chatForm" class="input-row" onsubmit="handleSubmit(event)">
    <textarea id="chatInput" class="chat-textarea" placeholder="Ask Kip anything about life in Australia…" rows="1" maxlength="800" aria-label="Type your question" autocomplete="off" spellcheck="true"></textarea>
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </form>
  <div class="input-footer">
    <p>Kip uses official Australian government sources. For complex visa &amp; legal matters, consult a <a href="https://www.mara.gov.au" target="_blank" rel="noopener">MARA registered agent</a>.</p>
  </div>
</div>

<script>
// THEME
(function(){
  const K='howdy-theme',h=document.documentElement;
  const t=document.getElementById('themeToggle');
  const m=document.getElementById('iconMoon'),s=document.getElementById('iconSun');
  function apply(v){h.setAttribute('data-theme',v);localStorage.setItem(K,v);m.style.display=v==='light'?'none':'block';s.style.display=v==='light'?'block':'none'}
  apply(localStorage.getItem(K)||'dark');
  t.addEventListener('click',()=>apply(h.getAttribute('data-theme')==='dark'?'light':'dark'));
})();

const chatArea=document.getElementById('chatArea');
const chatInput=document.getElementById('chatInput');
const sendBtn=document.getElementById('sendBtn');
const startersEl=document.getElementById('starters');
let history=[],isWaiting=false;

window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>appendKipMessage("G'day! I'm **Kip**, your Australian life copilot 👋\n\nI can help you with **visas**, **work rights**, **tax**, **housing**, **healthcare**, **banking**, **cost of living** and more — all grounded in official Australian government sources.\n\nWhat would you like to know?",[]),300);
});

chatInput.addEventListener('input',()=>{
  chatInput.style.height='auto';chatInput.style.height=Math.min(chatInput.scrollHeight,120)+'px';
  sendBtn.disabled=!chatInput.value.trim()||isWaiting;
});
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!sendBtn.disabled)handleSubmit(e)}});
function sendStarter(btn){chatInput.value=btn.textContent;chatInput.dispatchEvent(new Event('input'));handleSubmit(new Event('submit'))}

async function handleSubmit(e){
  if(e&&e.preventDefault)e.preventDefault();
  const text=chatInput.value.trim();if(!text||isWaiting)return;
  if(startersEl)startersEl.style.display='none';
  chatInput.value='';chatInput.style.height='auto';sendBtn.disabled=true;isWaiting=true;
  appendUserMessage(text);const typingEl=showTyping();scrollToBottom();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-8)})});
    const data=await res.json();removeTyping(typingEl);
    if(!res.ok||data.error){appendKipMessage(data.error||"Something went wrong. Please try again.",[]);}
    else{appendKipMessage(data.reply,[]);history.push({role:'user',content:text});history.push({role:'assistant',content:data.reply});if(history.length>30)history=history.slice(-30);}
  }catch{removeTyping(typingEl);appendKipMessage("I lost my connection for a moment. Please check your internet and try again.",[]);}
  isWaiting=false;sendBtn.disabled=!chatInput.value.trim();scrollToBottom();
}

// Unique ID counter for SVG gradient IDs
let kipCount=0;
function kipSvg(){
  const id='AV'+(++kipCount);
  return `<svg width="32" height="32" viewBox="0 0 120 120" fill="none" aria-hidden="true">
    <defs>
      <radialGradient id="${id}-b" cx="38%" cy="28%" r="64%"><stop offset="0%" stop-color="#C4B5FD"/><stop offset="40%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#3B0764"/></radialGradient>
      <radialGradient id="${id}-i" cx="28%" cy="22%" r="72%"><stop offset="0%" stop-color="#67E8F9"/><stop offset="55%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0369A1"/></radialGradient>
      <filter id="${id}-g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="${id}-s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3B0764" flood-opacity=".55"/></filter>
    </defs>
    <circle cx="60" cy="60" r="40" fill="url(#${id}-b)" filter="url(#${id}-s)"/>
    <ellipse cx="44" cy="38" rx="14" ry="8" fill="rgba(255,255,255,.26)" transform="rotate(-30 44 38)"/>
    <g class="kip-eye-l"><circle cx="44" cy="60" r="9" fill="#1E1B4B"/><circle cx="44" cy="60" r="6" fill="url(#${id}-i)" filter="url(#${id}-g)"/><circle cx="41" cy="57" r="2.4" fill="#fff" opacity=".95"/></g>
    <g class="kip-eye-r"><circle cx="76" cy="60" r="9" fill="#1E1B4B"/><circle cx="76" cy="60" r="6" fill="url(#${id}-i)" filter="url(#${id}-g)"/><circle cx="73" cy="57" r="2.4" fill="#fff" opacity=".95"/></g>
    <ellipse cx="33" cy="72" rx="8" ry="5" fill="rgba(249,168,212,.4)"/>
    <ellipse cx="87" cy="72" rx="8" ry="5" fill="rgba(249,168,212,.4)"/>
    <path d="M44 78 Q60 94 76 78" fill="none" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" filter="url(#${id}-g)"/>
  </svg>`;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function extractSources(text){
  const sources=[];const pattern=/\*{0,2}Source:\s*([^\n\*]+)\*{0,2}/gi;let m;
  while((m=pattern.exec(text))!==null){const s=m[1].trim();if(s&&!sources.includes(s))sources.push(s)}
  return{cleaned:text.replace(/\*{0,2}Source:[^\n]+\n?/gi,'').trim(),sources};
}
function renderMarkdown(text){
  let s=escapeHtml(text);
  s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^[ \t]*[-•*] (.+)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g,m=>`<ul>${m}</ul>`);
  s=s.replace(/\n\n+/g,'</p><p>');s=s.replace(/\n/g,'<br>');
  return`<p>${s}</p>`;
}
function appendKipMessage(rawText,_){
  const{cleaned,sources}=extractSources(rawText);
  const row=document.createElement('div');row.className='msg-row';row.setAttribute('role','listitem');
  const av=document.createElement('div');av.className='msg-avatar';av.innerHTML=kipSvg();av.setAttribute('aria-hidden','true');
  const wrap=document.createElement('div');wrap.className='msg-wrap';
  const bub=document.createElement('div');bub.className='msg-bubble kip-bubble';bub.innerHTML=renderMarkdown(cleaned);
  wrap.appendChild(bub);
  if(sources.length){
    const srcEl=document.createElement('div');srcEl.className='msg-sources';
    sources.forEach(src=>{const ch=document.createElement('span');ch.className='source-chip';ch.innerHTML=`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>${escapeHtml(src)}`;srcEl.appendChild(ch);});
    wrap.appendChild(srcEl);
  }
  row.appendChild(av);row.appendChild(wrap);chatArea.appendChild(row);scrollToBottom();
}
function appendUserMessage(text){
  const row=document.createElement('div');row.className='msg-row user';row.setAttribute('role','listitem');
  const av=document.createElement('div');av.className='msg-avatar user-av';av.textContent='You';av.setAttribute('aria-hidden','true');
  const wrap=document.createElement('div');wrap.className='msg-wrap';
  const bub=document.createElement('div');bub.className='msg-bubble user-bubble';bub.textContent=text;
  wrap.appendChild(bub);row.appendChild(wrap);row.appendChild(av);chatArea.appendChild(row);
}
function showTyping(){
  const row=document.createElement('div');row.className='typing-row';row.id='typingRow';row.setAttribute('aria-label','Kip is typing');
  row.innerHTML=`<div class="msg-avatar" aria-hidden="true">${kipSvg()}</div><div class="typing-dots" aria-hidden="true"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  chatArea.appendChild(row);scrollToBottom();return row;
}
function removeTyping(el){if(el&&el.parentNode)el.parentNode.removeChild(el)}
function scrollToBottom(){requestAnimationFrame(()=>{chatArea.scrollTop=chatArea.scrollHeight})}
</script>
