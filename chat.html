<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kip — Ask anything about life in Australia | Howdy</title>
<meta name="description" content="Ask Kip about visas, tax, housing, work and health in Australia. Every answer cites verified official sources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1F2933; --ink-2:#52606D; --ink-3:#9AA5B1;
  --brand:#0E7C66; --brand-dark:#0A5C4C; --brand-soft:#E3F2EE;
  --line:#E4E0D8; --user-bubble:#0E7C66;
  --fd:'Fraunces',Georgia,serif; --fb:'Plus Jakarta Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12181D; --card:#1B242B; --ink:#F0F4F8; --ink-2:#AEBAC5; --ink-3:#66737E;
    --brand:#2FB899; --brand-dark:#25997F; --brand-soft:#173A32; --line:#2A353D;
    --user-bubble:#0E7C66;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}

/* Header */
header{border-bottom:1px solid var(--line);background:var(--card)}
.head-in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.kip-face{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.head-txt{flex:1;min-width:0}
.head-txt h1{font-family:var(--fd);font-size:1.1rem;font-weight:600}
.head-txt p{font-size:.75rem;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#3BA55C;display:inline-block}
.home-link{font-size:.82rem;font-weight:600;text-decoration:none}

/* Module chips */
.chips{border-bottom:1px solid var(--line);background:var(--card)}
.chips-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips-in::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:transparent;color:var(--ink-2);border-radius:99px;padding:7px 14px;font-family:var(--fb);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover,.chip.active{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* Messages */
main{flex:1;overflow-y:auto}
.msgs{max-width:860px;margin:0 auto;padding:24px 16px 12px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:10px;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;margin-top:2px}
.bubble{border-radius:16px;padding:12px 16px;font-size:.94rem;line-height:1.65;overflow-wrap:break-word}
.msg.kip .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.msg.user .bubble{background:var(--user-bubble);color:#fff;border-top-right-radius:4px}
.bubble ul{padding-left:20px;margin:6px 0}
.bubble p{margin:6px 0}
.bubble p:first-child{margin-top:0}
.bubble p:last-child{margin-bottom:0}

/* Verified sources panel */
.sources{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.78rem}
.sources .badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--brand);margin-bottom:6px}
.sources a{display:block;color:var(--ink-2);text-decoration:none;padding:2px 0;word-break:break-all}
.sources a:hover{color:var(--brand)}

/* Typing indicator */
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* Suggestions */
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.suggest button{border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:12px;padding:8px 13px;font-family:var(--fb);font-size:.82rem;cursor:pointer;text-align:left;transition:all .15s}
.suggest button:hover{border-color:var(--brand);color:var(--brand)}

/* Composer */
.composer{border-top:1px solid var(--line);background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.comp-in{max-width:860px;margin:0 auto;display:flex;gap:10px}
.comp-in input{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:13px 20px;font-family:var(--fb);font-size:.95rem}
.comp-in input:focus{outline:none;border-color:var(--brand)}
.comp-in button{border:none;background:var(--brand);color:#fff;border-radius:99px;padding:0 22px;font-family:var(--fb);font-weight:700;font-size:.95rem;cursor:pointer;transition:background .2s}
.comp-in button:hover{background:var(--brand-dark)}
.comp-in button:disabled{opacity:.5;cursor:default}
.fine{max-width:860px;margin:8px auto 0;text-align:center;font-size:.7rem;color:var(--ink-3)}
</style>
</head>
<body>

<header><div class="head-in">
  <div class="kip-face">🐨</div>
  <div class="head-txt">
    <h1>Kip</h1>
    <p><span class="dot"></span> Verified sources on every answer</p>
  </div>
  <a class="home-link" href="/">← Howdy</a>
</div></header>

<div class="chips"><div class="chips-in" id="chips"></div></div>

<main id="main"><div class="msgs" id="msgs"></div></main>

<div class="composer">
  <form class="comp-in" id="form">
    <input id="input" type="text" placeholder="Ask about visas, tax, housing…" maxlength="800" autocomplete="off">
    <button id="send" type="submit">Ask</button>
  </form>
  <p class="fine">Kip gives general guidance from official sources — not legal, migration or financial advice. Don't share personal details like your TFN or passport number.</p>
</div>

<script>
'use strict';

// ── Modules (kept in sync with lib/modules.js) ─────────────────────────────
const MODULES = [
  {id:'arrive',emoji:'🛬',name:'Just Landed',examples:['What should I do in my first week in Australia?','What documents do I need to set up my life here?']},
  {id:'visa',emoji:'🛂',name:'Visas & Work',examples:['How many hours can I work on a student visa?','How do I apply for the 485 visa after graduation?','How do I check my visa conditions?']},
  {id:'tax',emoji:'🧾',name:'TFN & Tax',examples:['How do I apply for a TFN?','What happens if I work without a TFN?','Can I claim my super when I leave Australia?']},
  {id:'work',emoji:'💼',name:'Jobs & Pay',examples:['What is the minimum wage in Australia?','My employer pays me cash below minimum wage — what can I do?']},
  {id:'housing',emoji:'🏠',name:'Housing',examples:['Two bedroom house near Acacia Ridge 4110 Brisbane','How much bond do I pay and how do I get it back?','What do I need to apply for a rental?']},
  {id:'health',emoji:'🏥',name:'Health & OSHC',examples:['What does my OSHC actually cover?','Am I eligible for Medicare as a student?']},
  {id:'money',emoji:'🏦',name:'Banking',examples:['Which bank account is best for students?','Can I open a bank account before I arrive?']},
  {id:'transport',emoji:'🚋',name:'Transport',examples:['How do I get a student discount on public transport in Brisbane?']},
  {id:'study',emoji:'🎓',name:'Student Life',examples:['What student discounts can I get in Australia?','How much should I budget for groceries each week?']},
  {id:'safety',emoji:'🛡️',name:'Safety & Scams',examples:['Someone called saying my visa will be cancelled unless I pay — is this a scam?','Where can I get mental health support as a student?']},
];

const msgs = document.getElementById('msgs');
const main = document.getElementById('main');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];
let busy = false;

// ── Safe rendering ─────────────────────────────────────────────────────────
// 1) escape ALL html from the model  2) apply minimal markdown
// 3) linkify only http(s) URLs (server already stripped unverified ones)
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderMarkdown(raw){
  let s = escapeHtml(raw);
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/https?:\/\/[^\s<)]+/g, (u) =>
    `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  // bullets
  const lines = s.split('\n');
  let html = '', inList = false;
  for (const line of lines){
    const m = line.match(/^\s*[-•·]\s+(.*)/);
    if (m){
      if (!inList){ html += '<ul>'; inList = true; }
      html += `<li>${m[1]}</li>`;
    } else {
      if (inList){ html += '</ul>'; inList = false; }
      if (line.trim()) html += `<p>${line}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html;
}

function addMsg(role, contentHtml){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = (role === 'kip' ? '<div class="avatar">🐨</div>' : '') +
    `<div class="bubble">${contentHtml}</div>`;
  msgs.appendChild(div);
  main.scrollTop = main.scrollHeight;
  return div;
}

function sourcesHtml(sources, verified){
  if (!sources || !sources.length) return '';
  const links = sources.map(s =>
    `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(s.domain)}</a>`).join('');
  return `<div class="sources"><span class="badge">${verified ? '✅ Verified sources' : '⚠️ Some links removed (unverified)'}</span>${links}</div>`;
}

// ── Chat flow ──────────────────────────────────────────────────────────────
async function ask(text){
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true; input.value = '';

  addMsg('user', escapeHtml(text));
  history.push({ role: 'user', content: text });

  const typing = addMsg('kip', '<span class="typing"><i></i><i></i><i></i></span>');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });
    const data = await r.json();
    typing.remove();
    if (!r.ok){
      addMsg('kip', `<p>${escapeHtml(data.error || 'Something went wrong — please try again.')}</p>`);
    } else {
      addMsg('kip', renderMarkdown(data.reply) + sourcesHtml(data.sources, data.verified));
      history.push({ role: 'assistant', content: data.reply });
      if (history.length > 16) history.splice(0, history.length - 16);
    }
  } catch {
    typing.remove();
    addMsg('kip', '<p>Network hiccup — please check your connection and try again.</p>');
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });

// ── Module chips + suggestions ─────────────────────────────────────────────
const chipsEl = document.getElementById('chips');
MODULES.forEach((m) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = `${m.emoji} ${m.name}`;
  b.addEventListener('click', () => showSuggestions(m, b));
  chipsEl.appendChild(b);
});

function showSuggestions(mod, chipBtn){
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chipBtn.classList.add('active');
  const old = document.getElementById('suggest-box');
  if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'suggest-box';
  div.className = 'msg kip';
  div.innerHTML = '<div class="avatar">🐨</div>' +
    `<div class="bubble"><p><strong>${mod.emoji} ${mod.name}</strong> — here's what students often ask:</p><div class="suggest">` +
    mod.examples.map(q => `<button type="button">${escapeHtml(q)}</button>`).join('') +
    '</div></div>';
  msgs.appendChild(div);
  div.querySelectorAll('.suggest button').forEach((btn) => {
    btn.addEventListener('click', () => { div.remove(); ask(btn.textContent); });
  });
  main.scrollTop = main.scrollHeight;
}

// ── Welcome ────────────────────────────────────────────────────────────────
addMsg('kip',
  "<p>G'day! I'm <strong>Kip</strong> 🐨 — your companion for life in Australia.</p>" +
  '<p>Ask me anything about visas, work, tax, housing or health. Every answer comes with <strong>verified official sources</strong>, and I never store anything personal.</p>' +
  '<p>Pick a topic above, or just type your question.</p>');

// Deep link: /chat?ask=...
const preset = new URLSearchParams(location.search).get('ask');
if (preset) ask(preset);
input.focus();
</script>
</body>
</html>
